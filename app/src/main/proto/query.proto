syntax = "proto3";
package cascada.v1;
option java_package = "com.cascada.app.adapter.in.grpc.protocol";
option java_multiple_files = true;
service QueryService { rpc Query(QueryRequest) returns (stream QueryChunk); }
enum ResponseFormat { PROTOBUF = 0; JSON = 1; PARQUET = 2; }
message QueryRequest { string sql = 1; ResponseFormat format = 2; }
message Column { string name = 1; string type = 2; }
message Cell { oneof value { int64 long_value = 1; double double_value = 2; string string_value = 3; string decimal_value = 4; } }
message Row { repeated Cell cells = 1; }
// First chunk includes schema and metadata. Encoded formats use payload; protobuf uses rows.
message QueryChunk { repeated Column columns = 1; repeated Row rows = 2; bytes payload = 3; string content_type = 4; int64 row_count = 5; bool served_through_cache = 6; }

service CacheService {
  rpc MeasureCache(EmptyRequest) returns (CacheSizeResponse);
  rpc FlushCache(FlushCacheRequest) returns (FlushCacheResponse);
  rpc WarmCache(WarmCacheRequest) returns (WarmCacheResponse);
}
message EmptyRequest {}
message CacheSizeResponse { int64 total_bytes = 1; int64 bucket_count = 2; double total_megabytes = 3; }
message FlushCacheRequest { optional string prefix = 1; }
message FlushCacheResponse { int64 buckets_purged = 1; }
message WarmCacheRequest { int64 start = 1; int64 end = 2; bool force_overwrite = 3; }
message WarmCacheResponse { int32 patterns_warmed = 1; int32 buckets_warmed = 2; int32 buckets_skipped = 3; }
service ClusterService { rpc ChangeCluster(ClusterRequest) returns (ClusterResponse); }
enum ClusterOperation { UNSPECIFIED = 0; DEPLOY = 1; STOP = 2; START = 3; RESTART = 4; DELETE = 5; }
message ClusterRequest { ClusterOperation operation = 1; map<string, string> settings = 2; }
message ClusterResponse { string status = 1; repeated string resources = 2; }
