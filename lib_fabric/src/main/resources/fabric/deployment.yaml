---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ${serviceAccountName}
  namespace: ${namespace}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: ${namespace}
  name: ${roleName}
rules:
# Core objects the Spark-on-Kubernetes driver creates and watches for its executors.
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec", "pods/status"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete", "deletecollection"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: [""]
  resources: ["configmaps"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Secrets: image-pull + HDFS/Delta credentials the executors mount (read-only is enough).
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["events"]
  verbs: ["get", "list", "watch", "create", "patch"]
- apiGroups: [""]
  resources: ["persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "delete"]
# Driver Deployment / lifecycle (stop = scale to 0, restart = rollout).
- apiGroups: ["apps"]
  resources: ["deployments", "deployments/scale", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
# Spark operator CRD, when the cluster is driven through kubeflow/spark-operator (optional operator).
- apiGroups: ["sparkoperator.k8s.io"]
  resources: ["sparkapplications", "scheduledsparkapplications"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ${roleBindingName}
  namespace: ${namespace}
subjects:
- kind: ServiceAccount
  name: ${serviceAccountName}
  namespace: ${namespace}
roleRef:
  kind: Role
  name: ${roleName}
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${coreSiteConfigMapName}
  namespace: ${namespace}
data:
  core-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>fs.defaultFS</name>
        <value>${hdfsDefaultFs}</value>
      </property>
      <property>
        <name>dfs.client.read.shortcircuit</name>
        <value>true</value>
      </property>
      <property>
        <name>dfs.client.use.datanode.hostname</name>
        <value>false</value>
      </property>
      <property>
        <name>dfs.domain.socket.path</name>
        <value>${dnSocketPath}/dn.sock</value>
      </property>
    </configuration>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${hdfsSiteConfigMapName}
  namespace: ${namespace}
data:
  hdfs-site.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
      <property>
        <name>dfs.client.read.shortcircuit</name>
        <value>true</value>
      </property>
      <property>
        <name>dfs.client.use.legacy.blockreader.local</name>
        <value>false</value>
      </property>
      <property>
        <name>dfs.domain.socket.path</name>
        <value>${dnSocketPath}</value>
      </property>
      <property>
        <name>dfs.client.use.datanode.hostname</name>
        <value>false</value>
      </property>
    </configuration>
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${podTemplateConfigMapName}
  namespace: ${namespace}
data:
  executor-pod-template.yaml: |
    apiVersion: v1
    kind: Pod
    spec:
      serviceAccountName: ${serviceAccountName}
      imagePullSecrets:
      - name: ${imagePullSecret}
      nodeSelector:
        ${placementLabel}: ${placementValue}
      containers:
      - name: spark-kubernetes-executor
        resources:
          requests:
            ephemeral-storage: 10Gi
          limits:
            ephemeral-storage: 20Gi
        env:
        - name: HADOOP_USER_NAME
          value: hadoop
        - name: HADOOP_CONF_DIR
          value: ${hadoopConfDir}
        volumeMounts:
        - name: hadoop-config-core
          mountPath: ${coreSiteMount}
          subPath: core-site.xml
          readOnly: true
        - name: hadoop-config-hdfs
          mountPath: ${hdfsSiteMount}
          subPath: hdfs-site.xml
          readOnly: true
        - name: hdfs-domain-socket
          mountPath: ${dnSocketPath}
          readOnly: false
        - name: data-volume
          mountPath: ${dataMountPath}
          readOnly: false
      volumes:
      - name: hadoop-config-core
        configMap:
          name: ${coreSiteConfigMapName}
      - name: hadoop-config-hdfs
        configMap:
          name: ${hdfsSiteConfigMapName}
      - name: hdfs-domain-socket
        hostPath:
          path: ${dnSocketPath}
          type: DirectoryOrCreate
      - name: data-volume
        hostPath:
          path: ${dataHostPath}
          type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${sparkConfigMapName}
  namespace: ${namespace}
data:
  spark.json: |
    {
      "spark.submit.deployMode": "client",
      "spark.driver.host": "${driverHost}",
      "spark.driver.port": "${driverPort}",
      "spark.blockManager.port": "${blockManagerPort}",
      "spark.driver.bindAddress": "0.0.0.0",
      "spark.driver.memory": "${driverMemory}",
      "spark.executor.memory": "${executorMemory}",
    "spark.executor.memoryOverhead": "${executorOverhead}",
    "spark.memory.offHeap.enabled": "${glutenEnabled}",
    "spark.memory.offHeap.size": "${executorOffHeap}",
      "spark.plugins": "${sparkPlugins}",
      "spark.shuffle.manager": "${shuffleManager}",
      "spark.executor.extraClassPath": "/opt/spark/jars/gluten.jar",
      "spark.gluten.memory.isolation": "true",
      "spark.gluten.sql.columnar.backend.velox.spillStrategy": "auto",
      "spark.gluten.sql.columnar.maxBatchSize": "4096",
      "spark.gluten.memory.dynamic.offHeap.sizing.enabled": "false",
      "spark.executor.cores": "${executorCores}",
      "spark.executor.instances": "${initialExecutors}",
      "spark.kubernetes.executor.limit.cores": "${executorLimitCores}",
      "spark.kubernetes.namespace": "${namespace}",
      "spark.kubernetes.container.image": "${containerImage}",
      "spark.kubernetes.container.image.pullSecrets": "${imagePullSecret}",
      "spark.kubernetes.container.image.pullPolicy": "IfNotPresent",
      "spark.kubernetes.authenticate.driver.serviceAccountName": "${serviceAccountName}",
      "spark.kubernetes.authenticate.executor.serviceAccountName": "${serviceAccountName}",
      "spark.kubernetes.executor.podNamePrefix": "${podNamePrefix}",
      "spark.kubernetes.executor.podTemplateFile": "${podTemplateMount}",
      "spark.scheduler.mode": "FAIR",
    "spark.scheduler.allocation.file": "/opt/spark/conf/fairscheduler.xml",
    "spark.executor.extraJavaOptions": "--enable-native-access=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.util.zip=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED",
      "spark.sql.extensions": "io.delta.sql.DeltaSparkSessionExtension",
      "spark.sql.catalog.spark_catalog": "org.apache.spark.sql.delta.catalog.DeltaCatalog",
      "spark.sql.files.maxPartitionBytes": "267108864",
      "spark.databricks.delta.optimize.maxFileSize": "267108864",
      "spark.sql.adaptive.advisoryPartitionSizeInBytes": "267108864",
      "spark.sql.adaptive.enabled": "true",
      "spark.sql.adaptive.skewJoin.enabled": "true",
      "spark.sql.adaptive.coalescePartitions.enabled": "true",
      "spark.sql.adaptive.localShuffleReader.enabled": "true",
      "spark.sql.execution.arrow.pyspark.enabled": "true",
      "spark.default.parallelism": "${shufflePartitions}",
      "spark.sql.shuffle.partitions": "${shufflePartitions}",
      "spark.dynamicAllocation.enabled": "true",
      "spark.dynamicAllocation.shuffleTracking.enabled": "true",
      "spark.dynamicAllocation.minExecutors": "${minExecutors}",
      "spark.dynamicAllocation.maxExecutors": "${maxExecutors}",
      "spark.dynamicAllocation.executorIdleTimeout": "60s",
      "spark.hadoop.fs.defaultFS": "${hdfsDefaultFs}",
    "spark.hadoop.dfs.client.read.shortcircuit": "true",
      "spark.hadoop.dfs.domain.socket.path": "${dnSocketPath}/dn.sock",
      "spark.sql.parquet.compression.codec": "snappy",
      "spark.databricks.delta.autoOptimize.optimizeWrite": "true",
      "spark.databricks.delta.autoOptimize.autoCompact": "true",
      "spark.driver.maxResultSize": "${driverMaxResultSize}"
    }
  application.json: |
    {
      "server": {"httpPort": ${httpPort}, "grpcPort": ${grpcPort}, "shutdownTimeout": "PT30S"},
      "warming": {"enabled": true, "interval": "PT5M", "lookback": "P7D", "maximumPatterns": 10000},
      "tables": [{"logicalName": "${mainTableName}", "deltaPath": "${mainTablePath}",
                  "columnMappings": {"${timeColumn}": "${timeColumn}"}, "timeColumns": ["${timeColumn}"]}]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ${log4jConfigMapName}
  namespace: ${namespace}
data:
  log4j2.properties: |
    rootLogger.level = error
    rootLogger.appenderRef.stdout.ref = console
    appender.console.type = Console
    appender.console.name = console
    appender.console.target = SYSTEM_ERR
    appender.console.layout.type = PatternLayout
    appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex
  fairscheduler.xml: |
    <allocations>
      <pool name="default">
        <schedulingMode>FAIR</schedulingMode>
        <weight>1</weight>
        <minShare>0</minShare>
      </pool>
    </allocations>

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${driverWorkloadName}
  namespace: ${namespace}
spec:
  replicas: ${replicas}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ${driverWorkloadName}
  template:
    metadata:
      labels:
        app: ${driverWorkloadName}
    spec:
      serviceAccountName: ${serviceAccountName}
      terminationGracePeriodSeconds: 120
      imagePullSecrets:
      - name: ${imagePullSecret}
      nodeSelector:
        ${placementLabel}: ${placementValue}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: ${driverWorkloadName}
            topologyKey: kubernetes.io/hostname
      containers:
      - name: spark-driver
        image: ${containerImage}
        command: ["java"]
        args: ["-cp", "/opt/spark/jars/gluten.jar:/app/cascada-app.jar:/app/lib/*:/opt/spark/jars/*:/opt/spark/work-dir:/opt/spark/conf", "com.cascada.app.bootstrap.CascadaLauncher"]
        imagePullPolicy: Always
        ports:
        - name: spark-driver
          containerPort: ${driverPort}
        - name: spark-blockmgr
          containerPort: ${blockManagerPort}
        - name: http-api
          containerPort: ${httpPort}
        - name: grpc-api
          containerPort: ${grpcPort}
        - name: spark-ui
          containerPort: 4040
        readinessProbe:
          httpGet:
            path: /health
            port: http-api
          initialDelaySeconds: 5
        resources:
          requests:
            memory: ${driverPodMemory}
            cpu: "1"
          limits:
            memory: ${driverPodMemory}
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: JAVA_TOOL_OPTIONS
          value: "-Xmx${driverMemory} --enable-native-access=ALL-UNNAMED -Dio.netty.tryReflectionSetAccessible=true --add-opens=java.base/jdk.internal.misc=ALL-UNNAMED --add-opens=java.base/java.util.zip=ALL-UNNAMED --add-opens=java.base/java.nio=ALL-UNNAMED --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.base/java.io=ALL-UNNAMED --add-opens=java.base/java.util=ALL-UNNAMED --add-opens=java.base/sun.nio.ch=ALL-UNNAMED --add-opens=java.base/sun.util.calendar=ALL-UNNAMED"
        - name: SPARK_CONFIG_PATH
          value: ${sparkJsonMount}
        - name: CASCADA_CONFIG_PATH
          value: /app/application.json
        - name: CASCADA_TIME_COLUMN
          value: "${timeColumn}"
        - name: CASCADA_RUN_MODE
          value: cluster
        - name: CASCADA_GLUTEN_ENABLED
          value: "${glutenEnabled}"
        - name: CASCADA_HTTP_PORT
          value: "${httpPort}"
        - name: CASCADA_GRPC_PORT
          value: "${grpcPort}"
        - name: CASCADA_MAIN_TABLE_NAME
          value: "${mainTableName}"
        - name: CASCADA_MAIN_TABLE_PATH
          value: "${mainTablePath}"
        - name: REDIS_URL
          value: "${redisUrl}"
        - name: SPARK_DRIVER_HOST
          value: ${driverHost}
        - name: HADOOP_USER_NAME
          value: hadoop
        - name: HADOOP_CONF_DIR
          value: ${hadoopConfDir}
        volumeMounts:
        - name: spark-config-volume
          mountPath: ${sparkJsonMount}
          subPath: spark.json
          readOnly: true
        - name: spark-config-volume
          mountPath: /app/application.json
          subPath: application.json
          readOnly: true
        - name: spark-log4j-volume
          mountPath: ${log4jMount}
          subPath: log4j2.properties
          readOnly: true
        - name: spark-log4j-volume
          mountPath: /opt/spark/conf/fairscheduler.xml
          subPath: fairscheduler.xml
          readOnly: true
        - name: spark-executor-pod-template
          mountPath: ${podTemplateMount}
          subPath: executor-pod-template.yaml
          readOnly: true
        - name: hadoop-config-core
          mountPath: ${coreSiteMount}
          subPath: core-site.xml
          readOnly: true
        - name: hadoop-config-hdfs
          mountPath: ${hdfsSiteMount}
          subPath: hdfs-site.xml
          readOnly: true
        - name: hdfs-domain-socket
          mountPath: ${dnSocketPath}
          readOnly: false
        - name: data-volume
          mountPath: ${dataMountPath}
          readOnly: false
      volumes:
      - name: spark-config-volume
        configMap:
          name: ${sparkConfigMapName}
      - name: spark-log4j-volume
        configMap:
          name: ${log4jConfigMapName}
      - name: spark-executor-pod-template
        configMap:
          name: ${podTemplateConfigMapName}
      - name: hadoop-config-core
        configMap:
          name: ${coreSiteConfigMapName}
      - name: hadoop-config-hdfs
        configMap:
          name: ${hdfsSiteConfigMapName}
      - name: hdfs-domain-socket
        hostPath:
          path: ${dnSocketPath}
          type: DirectoryOrCreate
      - name: data-volume
        hostPath:
          path: ${dataHostPath}
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: ${driverServiceName}
  namespace: ${namespace}
spec:
  clusterIP: None
  selector:
    app: ${driverWorkloadName}
  ports:
  - name: http-api
    protocol: TCP
    port: ${httpPort}
    targetPort: ${httpPort}
  - name: grpc-api
    protocol: TCP
    port: ${grpcPort}
    targetPort: ${grpcPort}
  - name: spark-driver
    protocol: TCP
    port: ${driverPort}
    targetPort: ${driverPort}
  - name: spark-blockmgr
    protocol: TCP
    port: ${blockManagerPort}
    targetPort: ${blockManagerPort}
